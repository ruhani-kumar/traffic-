name: Code Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check installed dependencies
        run: python -m pip check

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Run configuration smoke check
        run: |
          python - <<'PY'
          import config
          import context
          import mongodb_storage

          assert config.ROUTES, "No routes configured"
          assert config.LOCATIONS, "No locations configured"
          assert config.TIMEZONE == "Asia/Kolkata"
          assert set(mongodb_storage.COLLECTIONS) == {
              "routes",
              "locations",
              "incident_summary",
              "raw_responses",
              "coverage_routes",
              "coverage_points",
              "incidents",
              "incident_runs",
          }
          run_context = context.get_run_context()
          assert run_context["run_time_ist"]
          assert run_context["weekday"]
          print("Configuration smoke check passed.")
          PY
