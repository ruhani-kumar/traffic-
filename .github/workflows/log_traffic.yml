name: Log Traffic
on:
  schedule:
    - cron: '30 * * * *'      # hourly backup only; cron-job.org triggers the 15-minute runs
  workflow_dispatch:          # cron-job.org uses this

permissions:
  contents: read

concurrency:                  # never two runs at the same time
  group: log-traffic
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python traffic_snapshot.py
        env:
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
      - name: Keep the CSV backup if the run failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: csv-backup-${{ github.run_id }}
          path: data/*.csv
